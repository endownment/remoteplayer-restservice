[package]
name = "remoteplayer-restservice"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "REST API that controls the remoteplayer mpv instance on a Raspberry Pi"
publish = false

[dependencies]
axum = { version = "0.8", features = ["ws", "multipart"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
md-5 = "0.10"
nix = { version = "0.30", features = ["ioctl", "fs", "signal", "process", "hostname"] }
sd-notify = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "fs", "process", "signal", "sync", "time"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xattr = "1"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
